  <style>
    /* ===== 解析结果面板：外框跟随站点主题，内部代码区单独处理 ===== */
    #codeshow {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      padding: .75rem;
      border: 1px solid var(--nb-border);
      border-radius: var(--nb-radius-md);
      background: var(--nb-muted);
      max-height: 34rem;
      overflow: auto;
    }

    /* ecode.js 生成的是 float 布局，这里改成普通块流，避免塌陷与满屏空白 */
    #codeshow .e_code_e_code { display: block; }
    /* ecode.js 的「复制代码」靠展开一个 textarea 手动选中，
       这里永久隐藏它，改由脚本直接写剪贴板（见页尾脚本） */
    #codeshow .e_code_data { display: none !important; }
    #codeshow .e_code_copy_codedata {
      box-sizing: border-box;
      width: 100%;
      height: 12rem;
      padding: .6rem !important;
      border: 1px solid var(--nb-border);
      border-radius: 6px;
      background: var(--nb-background);
      color: var(--nb-foreground);
      font: 12px/1.6 var(--nb-font-mono);
      resize: vertical;
    }
    #codeshow .e_code_copy {
      display: block;
      text-align: right;
      width: auto;
      height: auto;
      float: none;
      background: transparent;
      margin-bottom: .5rem;
    }
    #codeshow .e_code_copy_button { display: inline-block; }
    #codeshow .e_code_copy_button a {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      width: auto;
      height: auto;
      float: none;
      padding: .35rem .7rem;
      border: 1px solid var(--nb-border);
      border-radius: 6px;
      background: var(--nb-background);
      color: var(--nb-foreground);
      font: 500 12px/1.2 var(--nb-font-mono);
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease;
    }
    #codeshow .e_code_copy_button a:hover {
      border-color: var(--nb-primary);
      color: var(--nb-primary);
    }

    /* 代码区：浅色"纸"，里面是 ecode.js 写死的深色语法色 */
    #codeshow .e_code_codecontainer {
      float: none;
      width: 100%;
      padding: .5rem .625rem;
      border: 1px solid var(--nb-border);
      border-radius: 6px;
      background: #fff;
      color: #111;
      overflow: auto;
    }
    /* 深色模式下把这张"纸"整体反相，语法色随之上翻，不用改解析器 */
    [data-theme="dark"] #codeshow .e_code_codecontainer {
      filter: invert(1) hue-rotate(180deg);
    }
    #codeshow .e_code_codearea {
      float: none;
      padding-top: 0;
    }
    #codeshow .e_code_codeline { float: none; }

    #codeshow table { width: auto; margin: 0 0 .35rem; }
    #codeshow .e_code_tab td,
    #codeshow .e_code_tab th { border-color: #c9ccd4; }
  </style>
</head>

        <textarea class="nb-textarea" id="code" spellcheck="false" style="min-height:16rem" aria-label="易语言源码">.版本 2

.子程序 GetProcessHandle, 整数型
.参数 lpProcessName, 文本型
.局部变量 hSnapShot, 整数型
.局部变量 dwRet, 整数型
.局部变量 prHandle, 整数型
.局部变量 pe32, PROCESSENTRY32

hSnapShot ＝ CreateToolhelp32Snapshot (#TH32CS_SNAPALL, 0)
.如果真 (hSnapShot ＝ 0)
    信息框 (“获得进程快照失败”, 0, )
    返回 (dwRet)
.如果真结束
pe32.dwSize ＝ 1024
prHandle ＝ Process32First (hSnapShot, pe32)
.判断循环首 (prHandle ≠ 0)
    .判断开始 (到文本 (pe32.szExeFile) ＝ lpProcessName)
        dwRet ＝ pe32.th32ProcessID
        跳出循环 ()
    .默认
        prHandle ＝ Process32Next (hSnapShot, pe32)
    .判断结束

.判断循环尾 ()
CloseHandle (hSnapShot)
返回 (dwRet)</textarea>

<script>
  var SAMPLE = document.getElementById('code').value;
  function run() {
    document.getElementById("codeshow_ecode_1").innerHTML = document.getElementById("code").value;
    trans("codeshow");
  }
  document.getElementById('restore-sample').addEventListener('click', function () {
    document.getElementById('code').value = SAMPLE;
    run();
  });
  document.getElementById('clear-code').addEventListener('click', function () {
    document.getElementById('code').value = '';
    document.getElementById('codeshow_ecode_1').innerHTML = '';
  });
  if (document.readyState === 'complete') { run(); } else { window.addEventListener('load', run); }

  /* 「复制代码」：直接写剪贴板，不再弹大文本框 */
  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacy(text, done); });
    } else {
      legacy(text, done);
    }
  }
  function legacy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('.e_code_copy_button a') : null;
    if (!a) return;
    e.preventDefault();
    var divid = (a.id || '').replace('copy_button_', '');
    var src = document.getElementById('codedata_' + divid);
    var text = src ? src.value : '';
    if (!text) return;
    copyText(text, function () {
      var old = a.textContent;
      a.textContent = '已复制';
      setTimeout(function () { a.textContent = old; }, 1400);
    });
  });
</script>
